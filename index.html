<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>郁翔＆蔣瑀婚宴系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600;800&family=Noto+Sans+TC:wght=400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = { theme: { extend: { colors: { burgundy: { 700: '#8c1c1c', 800: '#721616', 900: '#5a1010' }, roseGold: { 500: '#f43f5e', 700: '#be185d' } }, fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #fcf8f8; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .bottom-sheet { transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .bottom-sheet.open { transform: translateY(0); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col overflow-x-hidden select-none pb-12">

    <header class="bg-burgundy-700 text-white shadow-md sticky top-0 z-40 px-4 py-3 flex flex-col gap-2">
        <div class="max-w-md mx-auto w-full flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-hotel text-amber-300 text-lg"></i>
                <div>
                    <h1 class="text-base font-black tracking-wider text-amber-100">郁翔＆蔣瑀婚宴系統</h1>
                    <p class="text-[10px] text-red-200">彭園 BCD 廳 整合管理</p>
                </div>
            </div>
        </div>
        <div class="max-w-md mx-auto w-full grid grid-cols-2 bg-burgundy-800 p-1 rounded-full border border-burgundy-900/40">
            <button onclick="switchTab('seating')" id="tabBtnSeating" class="py-2 text-xs font-black rounded-full bg-white text-burgundy-800 shadow-md">桌次地圖</button>
            <button onclick="switchTab('cakes')" id="tabBtnCakes" class="py-2 text-xs font-bold text-burgundy-200">喜餅發放</button>
        </div>
    </header>

    <main class="flex-1 py-4 px-3 flex flex-col items-center w-full max-w-4xl mx-auto">
        <section id="sectionSeating" class="w-full flex flex-col items-center gap-4">
            <div id="seatingGrid" class="grid grid-cols-11 gap-x-1 gap-y-7 relative mt-4"></div>
        </section>
        <section id="sectionCakes" class="w-full max-w-md flex flex-col gap-4 hidden">
            <div id="cakeGuestList" class="flex flex-col gap-2"></div>
        </section>
    </main>

    <div id="bottomSheet" class="fixed bottom-0 left-0 right-0 bg-white border-t rounded-t-[1.8rem] z-50 bottom-sheet max-h-[80vh] flex flex-col">
        <div class="px-6 py-4 flex justify-between items-center border-b">
            <h2 id="drawerTitle" class="text-base font-bold text-slate-800">桌位詳情</h2>
            <button onclick="closeBottomSheet()" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto px-6 py-4" id="drawerGuestList"></div>
    </div>
    <div id="backdrop" onclick="closeBottomSheet()" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

    <script>
        const seatingData = {
            "主桌": ["蘇郁翔", "蔣瑀", "男方媽媽", "女方媽媽", "郁翔爺爺", "郁翔大伯", "王文章", "王文杰", "吳兆洸", "吳兆芳", "蔣義斌（素）", "蔣侃學（素）"],
            "19": ["廖盛恩", "許家馨", "蕭加恩", "董信慈", "蘇家萱", "林孟慧", "楊予欣", "徐宛瑜", "施政良", "林箴言"],
            "24": ["李欣芳", "鄭佩儒", "陳玲玉", "徐瑋慧", "侯淑鳳（素）", "蔡惠鈴", "陳品蓉", "俞蓓華", "陳桂枝", "高連春"]
        };
        const defaultCakeData = [
            { name: "陳玲玉", type: "喜餅" },
            { name: "葉永盛&蘇育俞", type: "喜餅" },
            { name: "許家馨", type: "喜餅" },
            { name: "吳子潔＆李旭恩", type: "喜餅" },
            { name: "張慧如&徐竹昉", type: "喜餅" }
        ];

        let checkedInCakes = new Map();
        let db;

        function initFirebase() {
            try {
                firebase.initializeApp({ databaseURL: "https://weddingseat-41c0b-default-rtdb.asia-southeast1.firebasedatabase.app/" });
                db = firebase.database();
                db.ref('cakes').on('value', s => { checkedInCakes.clear(); Object.entries(s.val() || {}).forEach(([k,v]) => { if(v) checkedInCakes.set(atob(k.replace(/-/g, '+').replace(/_/g, '/').replace(/~/g, '=')), true); }); renderCakeList(); });
            } catch(e) {}
        }

        window.renderCakeList = function() {
            const container = document.getElementById('cakeGuestList');
            container.innerHTML = '';
            defaultCakeData.forEach(guest => {
                const isDelivered = checkedInCakes.has(guest.name);
                const div = document.createElement('div');
                div.className = `p-4 rounded-2xl border flex items-center justify-between cursor-pointer ${isDelivered ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-rose-100'}`;
                div.onclick = () => { if(db) db.ref('cakes/' + btoa(guest.name).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '~')).set(isDelivered ? null : true); };
                div.innerHTML = `<div class="flex-1"><div class="font-bold text-sm text-slate-800">${guest.name}</div><div class="text-[10px] text-slate-400 mt-0.5">${guest.type}</div></div>
                                 <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${isDelivered ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-200'}">
                                    ${isDelivered ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                 </div>`;
                container.appendChild(div);
            });
        };

        window.switchTab = function(tab) {
            document.getElementById('sectionSeating').classList.toggle('hidden', tab !== 'seating');
            document.getElementById('sectionCakes').classList.toggle('hidden', tab !== 'cakes');
        };

        window.onload = () => { initFirebase(); renderCakeList(); };
    </script>
</body>
</html>
